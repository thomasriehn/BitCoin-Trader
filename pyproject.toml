[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btctrader"
version = "0.1.0"
description = "Own services around Freqtrade for a fee-aware BTC/EUR bot: ledger (FIFO tax log), guard (risk limits), advisor (local vLLM regime signal), dashboard"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "ccxt>=4.4",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "python-dateutil>=2.9",
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "freezegun>=1.4",
  "ruff>=0.5",
]

[project.scripts]
btctrader-advisor = "btctrader.advisor.cli:main"
btctrader-ledger = "btctrader.ledger.cli:main"
btctrader-guard = "btctrader.guard.cli:main"
btctrader-dashboard = "btctrader.dashboard.cli:main"

[tool.setuptools.packages.find]
include = ["btctrader*"]

[tool.setuptools.package-data]
"btctrader.advisor" = ["prompts/*.md"]
"btctrader.dashboard" = ["templates/*.html", "static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
